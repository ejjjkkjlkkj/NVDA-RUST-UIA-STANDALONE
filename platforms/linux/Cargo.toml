[package]
name = "nvda-rust-atspi-linux"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
atspi = { version = "=0.30.0", default-features = false, features = ["connection", "p2p", "proxies", "wrappers", "tokio"] }
futures-util = "0.3"
nvda-rust-uia-standalone = { path = "../.." }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
