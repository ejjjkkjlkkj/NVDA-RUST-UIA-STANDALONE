name: Windows Secure Test Build

on:
  push:
    branches:
      - automation/security-hardening
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Windows x64 secure test package
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: secure-test-windows-x64

      - name: Quality gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked --no-deps -- -D warnings

      - name: Build release x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc -vV
          cargo -V
          cargo build --release --locked --target x86_64-pc-windows-msvc
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\nvda-rust-uia-standalone.exe'
          if (-not (Test-Path $exe)) { throw "Release executable missing: $exe" }

      - name: Check PE mitigations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\nvda-rust-uia-standalone.exe'
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe x64 not found' }
          $headers = & $dumpbin.FullName /headers $exe | Out-String
          if ($headers -notmatch '8664 machine \(x64\)') { throw 'PE is not x64' }
          if ($headers -notmatch 'High Entropy Virtual Addresses') { throw 'HIGH_ENTROPY_VA missing' }
          if ($headers -notmatch 'Dynamic base') { throw 'ASLR missing' }
          if ($headers -notmatch 'NX compatible') { throw 'NX_COMPAT missing' }
          Write-Host 'PE_SECURITY = PASS'

      - name: Check diagnostic redaction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\nvda-rust-uia-standalone.exe'
          $evidence = Join-Path $PWD 'secure-test-evidence\diagnostic-redaction'
          & '.\tests\windows\RunDiagnosticRedactionE2E.ps1' -ScreenReaderExe $exe -EvidenceDir $evidence

      - name: Check password privacy
        shell: pwsh
        env:
          NVDA_RUST_DIAGNOSTICS_INCLUDE_TEXT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\nvda-rust-uia-standalone.exe'
          $evidence = Join-Path $PWD 'secure-test-evidence\password-privacy'
          & '.\tests\windows\RunPasswordPrivacyE2E.ps1' -ScreenReaderExe $exe -EvidenceDir $evidence

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist-secure-test'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $sourceExe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\nvda-rust-uia-standalone.exe'
          $targetExe = Join-Path $dist 'nvda-rust-uia-standalone.exe'
          Copy-Item $sourceExe $targetExe
          $hash = (Get-FileHash $targetExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nvda-rust-uia-standalone.exe" | Set-Content (Join-Path $dist 'nvda-rust-uia-standalone.exe.sha256') -Encoding ascii
          @(
            'NVDA Rust UIA Standalone - Secure test build',
            "Commit: $env:GITHUB_SHA",
            'Target: x86_64-pc-windows-msvc',
            "rustc: $(rustc --version)",
            "cargo: $(cargo --version)",
            'Privilege: asInvoker; no administrator requirement',
            'UIAccess: disabled',
            'Diagnostics: text and text length redacted by default',
            'Password content: always redacted',
            'Authenticode: UNSIGNED DEVELOPMENT BUILD',
            "SHA256: $hash"
          ) | Set-Content (Join-Path $dist 'BUILD-INFO.txt') -Encoding utf8
          @(
            'NVDA Rust UIA Standalone - build de test Windows x64',
            '',
            'Verifiez le fichier .sha256 avant execution.',
            'Aucun droit administrateur n est necessaire.',
            'Lancez START-5-MINUTES.cmd pour le test principal.',
            'Testez au clavier dans Bloc-notes, Parametres, Terminal et Microsoft Edge.',
            'Quittez temporairement JAWS ou NVDA si les voix se chevauchent.',
            'Les diagnostics masquent le texte utilisateur et sa longueur par defaut.',
            '',
            'Build de developpement NON signe Authenticode. Ne desactivez pas SmartScreen ou Defender globalement.'
          ) | Set-Content (Join-Path $dist 'README-TEST.txt') -Encoding utf8
          @('@echo off','cd /d "%~dp0"','echo Test 5 minutes - aucun droit administrateur requis','nvda-rust-uia-standalone.exe 300','pause') | Set-Content (Join-Path $dist 'START-5-MINUTES.cmd') -Encoding ascii
          @('@echo off','cd /d "%~dp0"','echo Test 15 minutes - aucun droit administrateur requis','nvda-rust-uia-standalone.exe 900','pause') | Set-Content (Join-Path $dist 'START-15-MINUTES.cmd') -Encoding ascii
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nvda-rust-uia-secure-test-windows-x64
          path: dist-secure-test/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nvda-rust-uia-secure-test-evidence
          path: secure-test-evidence/**
          if-no-files-found: warn
          retention-days: 30
