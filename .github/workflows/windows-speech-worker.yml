name: Windows Async Speech Worker

on:
  push:
    branches: [automation/speech-worker]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-speech-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-speech-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speech-worker:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked
      - name: Initialize and flush async speech worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $PWD 'speech-worker.log'
          & '.\target\release\nvda-rust-uia-standalone.exe' 0 2>&1 | Tee-Object -FilePath $log
          $text = Get-Content $log -Raw
          foreach ($marker in @(
            'SPEECH_WORKER = READY',
            'SPEECH_OUTPUT_INIT = PASS',
            'SPEECH_DISPATCH = ASYNC_WORKER',
            'SPEECH_FLUSH = PASS',
            'SPEECH_QUEUE_COUNTS | enqueue_failures=0'
          )) {
            if (-not $text.Contains($marker)) { throw "Missing marker: $marker" }
          }

          $match = [regex]::Match($text, 'SPEECH_COUNTS \| requested=(\d+) \| output=(\d+) \| failed=(\d+)')
          if (-not $match.Success) { throw 'Missing SPEECH_COUNTS summary' }

          $requested = [int]$match.Groups[1].Value
          $output = [int]$match.Groups[2].Value
          $failed = [int]$match.Groups[3].Value
          if ($failed -ne 0) { throw "Speech failures detected: $failed" }
          if ($requested -ne $output) {
            throw "Speech request/output mismatch: requested=$requested output=$output"
          }

          "ASYNC_SPEECH_WORKER_SMOKE = PASS | requested=$requested | output=$output | failed=$failed"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-async-speech-worker-log
          path: speech-worker.log
          if-no-files-found: warn
          retention-days: 30
