name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt
        run: cargo fmt --all -- --check

  quality:
    name: Quality / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Toolchain versions
        shell: bash
        run: |
          rustc -vV
          cargo -V
          rustup show active-toolchain

      - name: Cargo check
        run: cargo check --all-targets --locked

      - name: Cargo test
        run: cargo test --all-targets --locked

      - name: Cargo clippy
        run: cargo clippy --all-targets --locked --no-deps -- -D warnings

      - name: Portable backend smoke
        if: runner.os != 'Windows'
        run: cargo run --locked -- 0

  windows-cross-check:
    name: Windows cross-check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with Windows MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross-${{ matrix.os }}

      - name: Compile-check Windows backend
        run: cargo check --target x86_64-pc-windows-msvc --all-targets --locked

  windows-release:
    name: Windows x64 release
    needs:
      - format
      - quality
      - windows-cross-check
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest stable Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Build optimized release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Generate SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "target/x86_64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Release executable not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "$($exe.FullName).sha256" -Encoding ascii
          Write-Host "EXE=$($exe.FullName)"
          Write-Host "SHA256=$hash"

      - name: Upload Windows x64 release
        uses: actions/upload-artifact@v7
        with:
          name: nvda-rust-uia-standalone-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/*.exe
            target/x86_64-pc-windows-msvc/release/*.exe.sha256
          if-no-files-found: error
          retention-days: 30
