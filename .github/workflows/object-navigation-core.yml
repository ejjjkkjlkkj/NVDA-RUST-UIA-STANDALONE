name: Object Navigation Core

on:
  push:
    branches: [automation/nvda-object-navigation-core]
    paths:
      - "src/navigation.rs"
      - "src/lib.rs"
      - "src/semantic.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/object-navigation-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-navigation-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Portable navigator semantics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: object-navigation-portable

      - name: Format, test and lint portable core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --lib --locked
          cargo clippy --lib --locked --no-deps -- -D warnings

  windows-compile:
    name: Windows V3 compatibility
    runs-on: windows-2025-vs2026
    needs: portable-core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: object-navigation-windows

      - name: Check full Windows V3 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --locked --target x86_64-pc-windows-msvc
          cargo clippy --locked --target x86_64-pc-windows-msvc --no-deps -- -D warnings
