name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-x64:
    name: Build Windows x64 release
    runs-on: windows-2025-vs2026
    permissions:
      contents: read

    steps:
      - name: Checkout immutable action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged commit to belong to main history
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tag commit is not an ancestor of origin/main'
          }
          "RELEASE_MAIN_ANCESTRY = PASS | commit=$($env:GITHUB_SHA)"

      - name: Install pinned stable Rust MSVC action
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-x64

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build optimized Windows x64 binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage release files and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "target/x86_64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw 'Release executable not found' }
          $dest = Join-Path $PWD "dist/$($exe.Name)"
          Copy-Item $exe.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "$dest.sha256" -Encoding ascii
          (Get-FileHash 'Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content 'dist/CARGO-LOCK.sha256' -Encoding ascii
          rustc -vV | Set-Content 'dist/RUST-TOOLCHAIN.txt' -Encoding utf8
          cargo -V | Add-Content 'dist/RUST-TOOLCHAIN.txt' -Encoding utf8
          "source_commit=$env:GITHUB_SHA" | Set-Content 'dist/SOURCE-COMMIT.txt' -Encoding ascii
          "SHA256=$hash"

      - name: Upload immutable release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nvda-rust-uia-standalone-${{ github.ref_name }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Attest and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download build payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nvda-rust-uia-standalone-${{ github.ref_name }}-windows-x64
          path: dist

      - name: Verify checksum before signing provenance
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          checksum_file=$(find . -maxdepth 1 -name '*.exe.sha256' -print -quit)
          test -n "$checksum_file"
          sha256sum --check "${checksum_file#./}"

      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/*.exe.sha256

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "NVDA Rust UIA ${GITHUB_REF_NAME}"
