name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    name: Windows x64 release
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install latest stable Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x64

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build optimized Windows x64 binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "target/x86_64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Release executable not found" }
          Copy-Item $exe.FullName "dist/$($exe.Name)"
          $hash = (Get-FileHash "dist/$($exe.Name)" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "dist/$($exe.Name).sha256" -Encoding ascii
          rustc -vV | Set-Content "dist/RUST-TOOLCHAIN.txt" -Encoding utf8
          cargo -V | Add-Content "dist/RUST-TOOLCHAIN.txt" -Encoding utf8
          Write-Host "SHA256=$hash"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvda-rust-uia-standalone-${{ github.ref_name }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "NVDA Rust UIA ${{ github.ref_name }}"
