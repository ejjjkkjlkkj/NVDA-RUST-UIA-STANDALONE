name: Android

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "platforms/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "platforms/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-android:
    name: Rust Android targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Check ARM64 Android core
        run: cargo check --lib --locked --target aarch64-linux-android

      - name: Check x86_64 Android core
        run: cargo check --lib --locked --target x86_64-linux-android

  android-emulator:
    name: Android AccessibilityService / emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Assemble app and instrumentation tests
        run: gradle -p platforms/android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real AccessibilityService test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            APK="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell settings put secure enabled_accessibility_services 'org.nvdarust.screenreader/org.nvdarust.screenreader.ScreenReaderAccessibilityService'
            adb shell settings put secure accessibility_enabled 1
            adb logcat -c
            adb shell am start -a android.settings.SETTINGS
            sleep 5
            gradle -p platforms/android :app:connectedDebugAndroidTest --stacktrace
            adb shell dumpsys accessibility | tee platforms/android/accessibility-dumpsys.txt
            adb logcat -d -s RustScreenReader:I '*:S' | tee platforms/android/accessibility-logcat.txt
            grep -q 'SERVICE_CONNECTED' platforms/android/accessibility-logcat.txt
            grep -q 'EVENT type=' platforms/android/accessibility-logcat.txt

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-accessibility-runtime-evidence
          path: |
            platforms/android/accessibility-dumpsys.txt
            platforms/android/accessibility-logcat.txt
            platforms/android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 30
