name: Android

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "platforms/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "platforms/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-android:
    name: Rust Android targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Check ARM64 Android core
        run: cargo check --lib --locked --target aarch64-linux-android

      - name: Check x86_64 Android core
        run: cargo check --lib --locked --target x86_64-linux-android

  android-emulator:
    name: Android 17 AccessibilityService / emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup latest Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android 17 / API 37.0 preview SDK
        shell: bash
        run: |
          set -euxo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            --channel=3
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Assemble app and instrumentation tests
        run: gradle -p platforms/android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real AccessibilityService test on Android 17 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # v2.38.0 does not yet natively understand the API 37.0 minor
          # platform package. Keep its platform installer on 36.1 while using
          # the actual Android 17 / API 37.0 system image installed from Canary.
          api-level: 36.1
          system-image-api-level: 37.0
          channel: canary
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            RELEASE="$(adb shell getprop ro.build.version.release | tr -d '\r')"
            SDK="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "ANDROID_RELEASE=$RELEASE"
            echo "ANDROID_SDK=$SDK"
            test "$SDK" = "37"
            APK="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell settings put secure enabled_accessibility_services 'org.nvdarust.screenreader/org.nvdarust.screenreader.ScreenReaderAccessibilityService'
            adb shell settings put secure accessibility_enabled 1
            adb logcat -c
            adb shell am start -a android.settings.SETTINGS
            sleep 5
            gradle -p platforms/android :app:connectedDebugAndroidTest --stacktrace
            adb shell dumpsys accessibility | tee platforms/android/accessibility-dumpsys.txt
            adb logcat -d -s RustScreenReader:I '*:S' | tee platforms/android/accessibility-logcat.txt
            grep -q 'SERVICE_CONNECTED' platforms/android/accessibility-logcat.txt
            grep -q 'EVENT type=' platforms/android/accessibility-logcat.txt

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-accessibility-runtime-evidence
          path: |
            platforms/android/accessibility-dumpsys.txt
            platforms/android/accessibility-logcat.txt
            platforms/android/app/build/reports/androidTests/**
            platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
