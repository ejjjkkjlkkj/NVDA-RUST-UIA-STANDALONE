name: Android

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "platforms/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "platforms/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-android:
    name: Rust Android targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Check ARM64 Android core
        run: cargo check --lib --locked --target aarch64-linux-android

      - name: Check x86_64 Android core
        run: cargo check --lib --locked --target x86_64-linux-android

  android-emulator:
    name: Android 17 AccessibilityService / emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup latest Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android 17 / API 37 SDK and emulator image
        id: android17
        shell: bash
        run: |
          set -euxo pipefail
          command -v sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "emulator" \
            --channel=3

          SDK_LIST="$RUNNER_TEMP/sdkmanager-list.txt"
          sdkmanager --list --channel=3 > "$SDK_LIST"
          IMAGE="system-images;android-37.0;google_apis;x86_64"

          if ! grep -Fq "$IMAGE" "$SDK_LIST"; then
            echo "Expected Android 17 x86_64 image is not published: $IMAGE" >&2
            echo "Available Android 17 x86_64 images:" >&2
            grep -E 'system-images;android-37([.][0-9A-Za-z._-]+)?;.*;x86_64' "$SDK_LIST" >&2 || true
            exit 1
          fi

          echo "ANDROID17_SYSTEM_IMAGE=$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          sdkmanager --install "$IMAGE" --channel=3
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -d "$ANDROID_SDK_ROOT/system-images/android-37.0/google_apis/x86_64"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Assemble app and instrumentation tests
        run: gradle -p platforms/android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Create and boot exact Android 17 AVD
        shell: bash
        env:
          ANDROID17_SYSTEM_IMAGE: ${{ steps.android17.outputs.image }}
        run: |
          set -euxo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo no | avdmanager create avd \
            --force \
            --name nvda_android17 \
            --package "$ANDROID17_SYSTEM_IMAGE" \
            --device pixel_6

          "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd nvda_android17 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -accel on \
            > platforms/android/emulator.log 2>&1 &
          echo $! > "$RUNNER_TEMP/android-emulator.pid"

          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/android-emulator.pid")" 2>/dev/null; then
              cat platforms/android/emulator.log >&2
              exit 1
            fi
            sleep 5
          done

          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          RELEASE="$(adb shell getprop ro.build.version.release | tr -d '\r')"
          SDK="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          CODENAME="$(adb shell getprop ro.build.version.codename | tr -d '\r')"
          echo "ANDROID_RELEASE=$RELEASE" | tee platforms/android/android-version.txt
          echo "ANDROID_SDK=$SDK" | tee -a platforms/android/android-version.txt
          echo "ANDROID_CODENAME=$CODENAME" | tee -a platforms/android/android-version.txt
          echo "ANDROID_IMAGE=$ANDROID17_SYSTEM_IMAGE" | tee -a platforms/android/android-version.txt
          test "$SDK" = "37"

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Real AccessibilityService runtime test
        shell: bash
        run: |
          set -euxo pipefail
          APK="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          adb install -r "$APK"
          adb shell settings put secure enabled_accessibility_services 'org.nvdarust.screenreader/org.nvdarust.screenreader.ScreenReaderAccessibilityService'
          adb shell settings put secure accessibility_enabled 1
          sleep 3

          adb logcat -c
          adb shell am start -a android.settings.SETTINGS
          sleep 5

          gradle -p platforms/android :app:connectedDebugAndroidTest --stacktrace
          adb shell dumpsys accessibility | tee platforms/android/accessibility-dumpsys.txt
          adb logcat -d -s RustScreenReader:I '*:S' | tee platforms/android/accessibility-logcat.txt

          grep -q 'SERVICE_CONNECTED' platforms/android/accessibility-logcat.txt
          grep -q 'EVENT type=' platforms/android/accessibility-logcat.txt
          grep -q 'org.nvdarust.screenreader' platforms/android/accessibility-dumpsys.txt
          echo "ANDROID_17_ACCESSIBILITY_RUNTIME = PASS"

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill || true
          if [[ -f "$RUNNER_TEMP/android-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/android-emulator.pid")" 2>/dev/null || true
          fi

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-accessibility-runtime-evidence
          path: |
            platforms/android/android-version.txt
            platforms/android/emulator.log
            platforms/android/accessibility-dumpsys.txt
            platforms/android/accessibility-logcat.txt
            platforms/android/app/build/reports/androidTests/**
            platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
