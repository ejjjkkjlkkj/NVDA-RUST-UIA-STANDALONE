name: Future Rust Compatibility

on:
  schedule:
    - cron: "43 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  future:
    name: ${{ matrix.toolchain }} / ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - beta
          - nightly
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: future-${{ matrix.toolchain }}-${{ matrix.os }}

      - name: Toolchain versions
        shell: bash
        run: |
          rustc -vV
          cargo -V

      - name: Cargo check
        run: cargo +${{ matrix.toolchain }} check --all-targets --locked

      - name: Cargo test
        run: cargo +${{ matrix.toolchain }} test --all-targets --locked

      - name: Cargo clippy
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --locked --no-deps -- -D warnings
