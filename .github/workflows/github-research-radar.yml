name: GitHub Research Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-research-radar.yml"

permissions:
  contents: read

concurrency:
  group: github-research-radar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Search GitHub for useful accessibility work
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search repositories and code
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');

            const topics = [
              {
                name: 'Windows UI Automation / Rust',
                repoQuery: 'UIAutomation accessibility Rust in:name,description,readme archived:false',
                codeQuery: 'UIAutomationClient language:Rust'
              },
              {
                name: 'Linux AT-SPI / Rust',
                repoQuery: 'atspi Rust accessibility in:name,description,readme archived:false',
                codeQuery: 'atspi language:Rust'
              },
              {
                name: 'Android AccessibilityService',
                repoQuery: 'AccessibilityService screen reader Android in:name,description,readme archived:false',
                codeQuery: 'TYPE_VIEW_ACCESSIBILITY_FOCUSED language:Java'
              },
              {
                name: 'Android UIAutomator accessibility testing',
                repoQuery: 'uiautomator accessibility Android in:name,description,readme archived:false',
                codeQuery: 'UiDevice language:Kotlin'
              },
              {
                name: 'macOS Accessibility API',
                repoQuery: 'AXUIElement accessibility macOS in:name,description,readme archived:false',
                codeQuery: 'AXUIElementCreateSystemWide language:Swift'
              },
              {
                name: 'iOS VoiceOver / UIAccessibility',
                repoQuery: 'UIAccessibility VoiceOver iOS in:name,description,readme archived:false',
                codeQuery: 'UIAccessibility.post language:Swift'
              },
              {
                name: 'Braille and screen-reader infrastructure',
                repoQuery: 'braille screen reader accessibility Rust in:name,description,readme archived:false',
                codeQuery: 'braille language:Rust'
              },
              {
                name: 'Accessible virtualization / QEMU',
                repoQuery: 'qemu accessibility in:name,description,readme archived:false',
                codeQuery: 'qemu accessibility'
              },
              {
                name: 'AOSP accessibility and screen readers',
                repoQuery: 'Android accessibility screen reader AOSP in:name,description,readme archived:false',
                codeQuery: 'AccessibilityService language:Java'
              }
            ];

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            function retryDelayMs(error, attempt) {
              const headers = error.response?.headers || {};
              const retryAfter = Number(headers['retry-after']);
              if (Number.isFinite(retryAfter) && retryAfter > 0) {
                return Math.min(75000, Math.ceil(retryAfter * 1000) + 1000);
              }

              const message = String(error.message || '');
              const match = message.match(/try again in\s+([0-9.]+)s/i);
              if (match) {
                return Math.min(75000, Math.ceil(Number(match[1]) * 1000) + 1500);
              }

              const reset = Number(headers['x-ratelimit-reset']);
              if (Number.isFinite(reset) && reset > 0) {
                const untilReset = (reset * 1000) - Date.now() + 1500;
                if (untilReset > 0) {
                  return Math.min(75000, untilReset);
                }
              }

              return Math.min(60000, 10000 * (attempt + 1));
            }

            async function withRateLimitRetry(label, fn) {
              let lastError;
              for (let attempt = 0; attempt < 3; attempt += 1) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const status = Number(error.status || error.response?.status || 0);
                  if (status !== 403 && status !== 429) {
                    throw error;
                  }

                  if (attempt === 2) {
                    break;
                  }

                  const delay = retryDelayMs(error, attempt);
                  core.warning(`${label}: GitHub search rate limit (${status}); retrying in ${Math.ceil(delay / 1000)}s`);
                  await sleep(delay);
                }
              }
              throw lastError;
            }

            const generatedAt = new Date().toISOString();
            const report = {
              generatedAt,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              topics: [],
              stats: {
                repositoryMatches: 0,
                codeMatches: 0,
                searchErrors: 0
              }
            };

            const clean = value => String(value ?? '').replace(/\r?\n/g, ' ').replace(/\|/g, '\\|');

            for (const topic of topics) {
              const result = {
                name: topic.name,
                repositoryQuery: topic.repoQuery,
                codeQuery: topic.codeQuery,
                repositories: [],
                code: [],
                errors: []
              };

              try {
                const repos = await withRateLimitRetry(
                  `${topic.name} repository search`,
                  () => github.rest.search.repos({
                    q: topic.repoQuery,
                    sort: 'updated',
                    order: 'desc',
                    per_page: 10
                  })
                );

                result.repositories = repos.data.items
                  .filter(repo => !repo.archived)
                  .map(repo => ({
                    fullName: repo.full_name,
                    url: repo.html_url,
                    description: repo.description || '',
                    stars: repo.stargazers_count,
                    language: repo.language || '',
                    updatedAt: repo.updated_at,
                    archived: repo.archived
                  }))
                  .sort((a, b) => b.stars - a.stars || b.updatedAt.localeCompare(a.updatedAt))
                  .slice(0, 8);
              } catch (error) {
                result.errors.push(`repository search: ${error.message}`);
              }

              report.topics.push(result);
            }

            for (let index = 0; index < report.topics.length; index += 1) {
              const topic = topics[index];
              const result = report.topics[index];

              if (index > 0) {
                await sleep(8000);
              }

              try {
                const code = await withRateLimitRetry(
                  `${topic.name} code search`,
                  () => github.rest.search.code({
                    q: topic.codeQuery,
                    per_page: 8
                  })
                );

                result.code = code.data.items.map(item => ({
                  repository: item.repository.full_name,
                  path: item.path,
                  url: item.html_url
                }));
              } catch (error) {
                result.errors.push(`code search: ${error.message}`);
              }
            }

            for (const topic of report.topics) {
              report.stats.repositoryMatches += topic.repositories.length;
              report.stats.codeMatches += topic.code.length;
              report.stats.searchErrors += topic.errors.length;
            }

            const lines = [];
            lines.push('# GitHub Research Radar');
            lines.push('');
            lines.push(`Generated: ${generatedAt}`);
            lines.push('');
            lines.push(`Repository matches: **${report.stats.repositoryMatches}**`);
            lines.push(`Code matches: **${report.stats.codeMatches}**`);
            lines.push(`Search errors: **${report.stats.searchErrors}**`);
            lines.push('');
            lines.push('This report searches public GitHub projects for implementation ideas, test strategies, and reusable accessibility patterns relevant to this repository. Results are references only; nothing is copied or merged automatically.');
            lines.push('');

            for (const topic of report.topics) {
              lines.push(`## ${topic.name}`);
              lines.push('');
              lines.push(`Repository query: \`${topic.repositoryQuery}\``);
              lines.push(`Code query: \`${topic.codeQuery}\``);
              lines.push('');

              if (topic.repositories.length) {
                lines.push('| Repository | Stars | Language | Updated | Description |');
                lines.push('| --- | ---: | --- | --- | --- |');
                for (const repo of topic.repositories) {
                  lines.push(`| [${clean(repo.fullName)}](${repo.url}) | ${repo.stars} | ${clean(repo.language)} | ${clean(repo.updatedAt)} | ${clean(repo.description)} |`);
                }
                lines.push('');
              } else {
                lines.push('_No repository matches._');
                lines.push('');
              }

              if (topic.code.length) {
                lines.push('Useful code matches:');
                for (const item of topic.code) {
                  lines.push(`- [${clean(item.repository)} — ${clean(item.path)}](${item.url})`);
                }
                lines.push('');
              } else {
                lines.push('_No code matches._');
                lines.push('');
              }

              if (topic.errors.length) {
                lines.push('Search warnings:');
                for (const error of topic.errors) {
                  lines.push(`- ${clean(error)}`);
                }
                lines.push('');
              }
            }

            const markdown = `${lines.join('\n')}\n`;
            fs.mkdirSync('research', { recursive: true });
            fs.writeFileSync('research/github-radar.md', markdown);
            fs.writeFileSync('research/github-radar.json', JSON.stringify(report, null, 2));

            await core.summary.addRaw(markdown).write();

            if (report.stats.searchErrors > 0) {
              core.setFailed(`GitHub Research Radar incomplete: ${report.stats.searchErrors} search error(s)`);
            }

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: github-research-radar
          path: |
            research/github-radar.md
            research/github-radar.json
          if-no-files-found: error
          retention-days: 30
