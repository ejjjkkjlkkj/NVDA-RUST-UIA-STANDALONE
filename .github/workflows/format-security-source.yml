name: Format Security Sources

on:
  push:
    branches: [automation/security-hardening]
    paths:
      - ".github/workflows/format-security-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          components: rustfmt
      - name: Format canonical Rust source
        run: cargo fmt --all
      - name: Prove canonical formatting
        run: cargo fmt --all -- --check
      - name: Stage formatted source
        run: |
          mkdir -p formatted-src/src
          cp src/windows_diagnostics.rs formatted-src/src/
          cp src/windows_runtime_v2.rs formatted-src/src/
          cp src/windows_speech.rs formatted-src/src/
          cp src/windows_textpattern2.rs formatted-src/src/
          cp src/main.rs formatted-src/src/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustfmt-security-sources
          path: formatted-src/**
          if-no-files-found: error
          retention-days: 1
