name: Format Security Sources

on:
  push:
    branches: [automation/security-hardening]
    paths:
      - ".github/workflows/format-security-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.ref == 'refs/heads/automation/security-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: automation/security-hardening
          persist-credentials: true

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          components: rustfmt

      - name: Format and verify canonical Rust source
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Commit only rustfmt changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src; then
            echo 'RUSTFMT_COMMIT = NO_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src
          git diff --cached --check
          git commit -m 'Apply canonical rustfmt to security sources'
          git push origin HEAD:automation/security-hardening
          echo 'RUSTFMT_COMMIT = PASS'
